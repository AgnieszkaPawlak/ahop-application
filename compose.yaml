services:
  backend:
    build:
      context: ./backend
    environment:
      APP_VERSION: local-compose

  frontend:
    build:
      context: ./frontend

  proxy:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
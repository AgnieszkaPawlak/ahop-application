name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::664660631786:role/GitHubAhopDeployRole
          aws-region: us-east-1
          role-session-name: github-ahop-test

      - name: Verify identity
        run: |
          aws sts get-caller-identity
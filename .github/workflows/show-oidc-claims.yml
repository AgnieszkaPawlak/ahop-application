name: Show OIDC Claims

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  show-claims:
    runs-on: ubuntu-latest

    steps:
      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = (
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              + "&audience=sts.amazonaws.com"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization":
                      f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          keys = [
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
              "environment"
          ]

          for key in keys:
              print(f"{key}={claims.get(key)}")
          PY